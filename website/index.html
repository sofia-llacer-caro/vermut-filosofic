<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Friction First — Interactive Diagram</title>
    <meta
      name="description"
      content="An interactive 3D exploration of the Friction First critical thinking diagram."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <header class="overlay overlay--top">
        <h1>Friction First</h1>
        <p>A toolkit for teaching critical thinking in an AI-saturated classroom.</p>
      </header>

      <div id="loading" class="overlay overlay--center">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p>Loading diagram…</p>
      </div>

      <footer class="overlay overlay--bottom">
        <p><span class="hint-drag">Drag</span> to rotate · <span class="hint-scroll">Scroll</span> to zoom</p>
        <div class="footer-actions">
          <button id="drop-note-toggle" type="button" aria-pressed="false" hidden>Drop a note</button>
          <button id="autorotate-toggle" type="button" aria-pressed="false">Auto-rotate</button>
        </div>
      </footer>

      <div id="note-form-overlay" class="note-form-overlay" hidden>
        <form id="note-form" class="note-form">
          <h2>Drop a note</h2>
          <label for="note-text">Your note</label>
          <textarea
            id="note-text"
            rows="4"
            maxlength="240"
            required
            placeholder="Share a thought about this part of the diagram…"
          ></textarea>
          <label for="note-name">Name <span>(optional)</span></label>
          <input id="note-name" type="text" maxlength="40" placeholder="Anonymous" />
          <div class="note-form-actions">
            <button type="button" id="note-form-cancel" class="ghost-button">Cancel</button>
            <button type="submit" class="primary-button">Pin it</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
